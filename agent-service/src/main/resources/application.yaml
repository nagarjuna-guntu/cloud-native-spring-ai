spring:
  application:
    name: agent-service

server:
  port: 4004

spring.jackson:
  deserialization:
    fail-on-null-for-primitives: false

spring.ai:
  ollama:
    base-url: http://localhost:11434
    chat.options.model: llama3.2 #qcwind/qwen3-8b-instruct-Q4-K-M:latest  #
    embedding.options.model: nomic-embed-text-v2-moe
    init.pull-model-strategy: when_missing
  tools:
    throw-exception-on-error: true
  mcp.client:
    name: book-shop-agent
    version: 1.0.0
    type: SYNC
    toolcallback:
      enabled: true
    streamable-http:
      connections:
        catalog-mcp-server:
          url: http://localhost:4001
          endpoint: /mcp
        order-mcp-server:
          url: http://localhost:4002
          endpoint: /mcp

logging.level:
  org.springframework.ai: DEBUG
  com.bookshop.agent: DEBUG

#OBSERVABILITY
management.tracing.sampling.probability: 1.0

management.opentelemetry:
  logging:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/logs
  tracing:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/traces

management.otlp:
  metrics:
    export:
      url: http://localhost:4318/v1/metrics