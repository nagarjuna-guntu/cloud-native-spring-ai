spring:
  application:
    name: order-service

server:
  port: 4002

spring.jackson:
  deserialization:
    fail-on-null-for-primitives: false

spring.ai:
  mcp.server:
    name: order-mcp-server
    version: 1.0.0
    protocol: STATELESS # no session state maintained with mcp clients, each request is independent, suited for stateless services
    type: sync
    instructions: "This stateless server provides you with the ability to manage orders"
    annotation-scanner:
      enabled: true

spring.datasource:
  username: user
  password: secret
  url: jdbc:postgresql://localhost:5432/polardb_order

spring.flyway:
  baseline-on-migrate: true

services:
  catalog:
    base-url: ${BOOK_CATALOG_SERVICE_URL:http://localhost:4001}

#spring.http.clients:
#  connect-timeout: 2s
#  read-timeout: 3s

spring.cloud.function:
  definition: orderDispatched

spring.cloud.stream:
  bindings:
    orderDispatched-in-0:
      destination: order-dispatched
      group: ${spring.application.name}
    orderAccepted-out-0:
      destination: order-accepted
  rabbit:
    bindings:
      orderAccepted-out-0:
        producer:
          transacted: true

spring.rabbitmq:
  host: localhost
  port: 5672
  username: user
  password: password
  connection-timeout: 5s

management.endpoints:
  web:
    exposure:
      include: health, flyway
management.endpoint:
  health:
    show-components: always
    show-details: always
    probes:
      enabled: true

#OBSERVABILITY
management.tracing.sampling.probability: 1.0

management.opentelemetry:
  logging:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/logs
  tracing:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/traces

management.otlp:
  metrics:
    export:
      url: http://localhost:4318/v1/metrics

logging.level:
  org.springframework.ai: DEBUG
  org.springframework.jdbc: DEBUG