spring:
  application:
    name: catalog-service

server:
  port: 4001

spring.jackson:
  deserialization:
    fail-on-null-for-primitives: false

spring.datasource:
  username: user
  password: secret
  url: jdbc:postgresql://localhost:5432/polardb_catalog

spring.cloud.function:
  definition: bookCreatedConsumer;bookUpdatedConsumer

spring.cloud.stream:
  bindings:

    # ----------- PRODUCERS -----------
    bookCreated-out-0:
      destination: book-created
    bookUpdated-out-0:
      destination: book-updated

    # ----------- CONSUMERS -----------
    bookCreatedConsumer-in-0:
      destination: book-created
      group: ${spring.application.name}
    bookUpdatedConsumer-in-0:
      destination: book-updated
      group: ${spring.application.name}

  # ----------- Transactional producers -----------
  rabbit:
    bindings:
      bookCreated-out-0:
        producer:
          transacted: true
      bookUpdated-out-0:
        producer:
          transacted: true
spring.rabbitmq:
  host: localhost
  port: 5672
  username: user
  password: password
  connection-timeout: 5s

spring.data:
  redis:
    host: localhost
    port: 6379
    connect-timeout: 2s
    timeout: 1s
    repositories:
      enabled: false  # prevent Redis from trying to manage your JPA/JDBC Repos

spring.flyway:
  baseline-on-migrate: true

spring.ai:
  model.chat: none # disable the chat model autoconfiguration
  ollama:
    base-url: http://localhost:11434
    embedding.options.model: nomic-embed-text-v2-moe
    init.pull-model-strategy: when_missing
  vectorstore:
    pgvector:
      schema-name: public
      table-name: vector_store
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 768 # Must match the model above
      initialize-schema: false # We are using Flyway (V3 script)
      max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
  mcp.server:
    name: catalog-mcp-server
    version: 1.0.0
    protocol: STATELESS # no session state maintained with mcp clients, each request is independent, suited for stateless services
    type: sync
    instructions: "This stateless server provides you with the ability to search for books in the catalog"
    annotation-scanner:
      enabled: true  # MCP will scan for annotated classes in the classpath and register them automatically

catalog:
  vector-search:
    strict:
      top-k: 5
      similarity-threshold: 0.35
    relaxed:
      enabled: true
      top-k: 3
      similarity-threshold: 0.20

management.endpoints:
  web:
    exposure:
      include: health, flyway

management.endpoint:
  health:
    show-components: always
    show-details: always
    probes:
      enabled: true

#OBSERVABILITY
management.tracing.sampling.probability: 1.0

management.opentelemetry:
  logging:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/logs
  tracing:
    export:
      otlp:
        endpoint: http://localhost:4318/v1/traces

management.otlp:
  metrics:
    export:
      url: http://localhost:4318/v1/metrics

logging.level:
  org.springframework.ai: DEBUG
  org.springframework.jdbc: DEBUG